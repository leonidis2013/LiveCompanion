# docker compose up -d
# Then open http://<this machine's IP>:8080 and add your devices under Settings > Devices.
# Settings, the SSH key and backups are kept in the livecompanion-data volume.
services:
  livecompanion:
    image: ghcr.io/leonidis2013/livecompanion:latest
    build: .
    container_name: livecompanion
    restart: unless-stopped
    ports:
      - "8080:8080"
      # development mode's public port: only for a reverse proxy, answers nothing until exposed mode is on
      - "8081:8081"
    volumes:
      - livecompanion-data:/data
    environment:
      TZ: America/Chicago
      # optional: keeps the encryption key for passwords and tokens off the data volume
      # LIVECOMPANION_MASTER_KEY: "a long random value"

volumes:
  livecompanion-data:

# docker compose up -d
# Then open http://<this machine's IP>:8080 and add your devices under Settings > Devices.
# Settings, the SSH key and backups are kept in the livecompanion-data volume.
services:
  livecompanion:
    image: ghcr.io/leonidis2013/livecompanion:latest
    build: .
    container_name: livecompanion
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - livecompanion-data:/data
    environment:
      TZ: America/Chicago

volumes:
  livecompanion-data:
